services:
  - type: web
    name: tradingview-gemini-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && echo "FORCED_REBUILD"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SECRET_TOKEN
        sync: false